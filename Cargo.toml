[package]
name = "keyarchy"
version = "0.1.0"
edition = "2021"
description = "A Wayland-first Omarchy hotkey trainer"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
iced = { version = "0.13", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.13"

[profile.release]
lto = "thin"
strip = true

